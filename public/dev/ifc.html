<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sandbox IFC</title>
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.js",
        "three/addons/": "/vendor/three/examples/jsm/",
        "three-mesh-bvh": "/vendor/three-mesh-bvh/src/index.js",
        "camera-controls": "/vendor/camera-controls/dist/camera-controls.module.js",
        "web-ifc": "/vendor/web-ifc/web-ifc-api.js"
      }
    }
  </script>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #e9e9e8; overflow: hidden; }
    #viewport { position: absolute; inset: 0; }
    #hud { position: absolute; left: 12px; top: 12px; z-index: 5; display: flex; gap: 6px; flex-wrap: wrap; max-width: 70vw; }
    #hud button { font: inherit; font-size: 12px; padding: 4px 10px; border: 0; border-radius: 999px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.15); cursor: pointer; }
    #hud button:hover { background: #ffc21a; }
    #hud button.on { background: #111; color: #fff; }
    #info { position: absolute; left: 12px; bottom: 12px; z-index: 5; background: rgba(255,255,255,.9); padding: 8px 12px; border-radius: 12px; font-size: 12px; max-width: 46vw; white-space: pre-wrap; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
    #progress { position: absolute; right: 12px; top: 12px; z-index: 5; background: #fff; padding: 6px 12px; border-radius: 999px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  </style>
</head>
<body>
  <div id="viewport"></div>
  <div id="hud"></div>
  <div id="progress">listo</div>
  <div id="info">Selecciona un elemento (clic). Ctrl/Shift = alternar.</div>
  <script type="module" src="/dev/ifc-sandbox.js"></script>
</body>
</html>
