<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sandbox del visor 3D</title>
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.js",
        "three/addons/": "/vendor/three/examples/jsm/",
        "three-mesh-bvh": "/vendor/three-mesh-bvh/src/index.js",
        "camera-controls": "/vendor/camera-controls/dist/camera-controls.module.js",
        "web-ifc": "/vendor/web-ifc/web-ifc-api.js"
      }
    }
  </script>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #e9e9e8; }
    #viewport { position: absolute; inset: 0; }
    #hud { position: absolute; left: 12px; top: 12px; z-index: 5; display: flex; gap: 6px; flex-wrap: wrap; }
    #hud button { font: inherit; padding: 4px 10px; border: 0; border-radius: 999px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.15); cursor: pointer; }
    #hud button:hover { background: #ffc21a; }
  </style>
</head>
<body>
  <div id="viewport"></div>
  <div id="hud"></div>
  <script type="module" src="/dev/viewer-sandbox.js"></script>
</body>
</html>
